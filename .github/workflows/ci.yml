name: CI

# Suppose un dépôt hébergé sur GitHub (le workflow "git fetch origin dev"
# utilisé pour déployer suggère un remote "origin" quelconque — à adapter
# si le dépôt est en fait sur GitLab/Gitea/etc., ce fichier ne servira à
# rien dans ce cas).
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Installer les dépendances Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Vérifier la parité des traductions fr/en/de
        run: composer check-translations

      - name: Lancer les tests PHP
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérification TypeScript
        run: npx tsc --noEmit

      - name: Build des assets (Vite)
        run: npm run build
